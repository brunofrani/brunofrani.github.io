---
layout: default
---
{%- assign project = site.projects | where: "slug", page.project | first -%}
<article class="prose legal">
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="{{ project.url | relative_url }}">{{ project.title }}</a>
    <span aria-hidden="true">/</span>
    <span aria-current="page">{{ page.short_title | default: page.title }}</span>
  </nav>
  <h1>{{ page.title }}</h1>
  <p class="meta">Last updated <time datetime="{{ page.last_updated | date: '%Y-%m-%d' }}">{{ page.last_updated | date: "%B %-d, %Y" }}</time></p>
  {{ content }}
</article>
