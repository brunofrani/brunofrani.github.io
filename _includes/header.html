<header class="site-header">
  <div class="container site-header__inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/projects/' | relative_url }}"{% if page.url == '/projects/' %} aria-current="page"{% elsif page.url contains '/projects/' %} aria-current="true"{% endif %}>Projects</a>
      {%- if site.posts.size > 0 %}
      <a href="{{ '/articles/' | relative_url }}"{% if page.url == '/articles/' %} aria-current="page"{% elsif page.collection == 'posts' %} aria-current="true"{% endif %}>Articles</a>
      {%- endif %}
    </nav>
  </div>
</header>
