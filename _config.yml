# Site settings. Restart `jekyll serve` after editing this file — it is not
# reloaded automatically.

title: Bruno Frani
description: iOS developer building small, carefully made apps and games.
url: "https://brunofrani.github.io"
baseurl: ""
lang: en

author:
  name: Bruno Frani
  # Shown on the home page and used as the contact address in every project's
  # Privacy Policy and Terms of Service. Until it is set, those pages show a
  # highlighted reminder where the address belongs.
  email: "brunofrani@outlook.com"

github_username: brunofrani

# Projects live in _projects/, one file each. Their legal pages live beside
# them under projects/<project>/.
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: posts
    values:
      layout: post

permalink: pretty

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

# Legal pages open with an automatic table of contents built from their
# second-level headings.
kramdown:
  toc_levels: "2..2"
